name: Infrastructure CI

# Pull request gates of the four root stacks (ADR-003, automation and pipelines
# section 4.2, PC-IAC-018). Cheapest gate first; a failed gate stops the job.
# No cloud credentials and no state are used: init runs with -backend=false.
# The saved qa plan is not part of this workflow (PD-019, B02, B04b, B06b).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: [state-backend, network, security, workload]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: terraform-version
        run: |
          version="$(tr -d '[:space:]' < .terraform-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: latest

      - name: Format check (terraform fmt)
        run: |
          terraform -chdir="stacks/${{ matrix.stack }}" fmt -check -recursive -diff

      - name: Initialize without backend (terraform init)
        run: |
          terraform -chdir="stacks/${{ matrix.stack }}" init -backend=false -input=false

      - name: Validate configuration (terraform validate)
        run: |
          terraform -chdir="stacks/${{ matrix.stack }}" validate -no-color

      - name: Lint stack (tflint)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --init --config="$config"
          tflint --config="$config" --chdir="stacks/${{ matrix.stack }}" --format compact

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: stacks/${{ matrix.stack }}
          exit-code: "1"
          severity: HIGH,CRITICAL
