name: Infrastructure CI

# Pull request gates and speculative plan of the four root stacks
# (PC-IAC-018, PC-IAC-028, ADR-003). Validates formatting, schema, linting,
# security configuration, unit tests and speculative execution plans against
# the Floci AWS emulator. Operates under strict plan-only discipline with no
# cloud credentials and no live resource creation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  env-secrets:
    name: Secret scan (variable and backend files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Scan for secrets
        run: bash scripts/check-env-secrets.sh .

  gates:
    name: Gates (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: [state-backend, network, security, workload]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: terraform-version
        run: |
          version="$(tr -d '[:space:]' < .terraform-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.66.0

      - name: Format check (terraform fmt)
        run: |
          terraform -chdir="stacks/${{ matrix.stack }}" fmt -check -recursive -diff

      - name: Initialize without backend (terraform init)
        run: |
          terraform -chdir="stacks/${{ matrix.stack }}" init -backend=false -input=false

      - name: Validate configuration (terraform validate)
        run: |
          terraform -chdir="stacks/${{ matrix.stack }}" validate -no-color

      - name: Lint stack (tflint)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --init --config="$config"
          tflint --config="$config" --chdir="stacks/${{ matrix.stack }}" --format compact

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: stacks/${{ matrix.stack }}
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Run unit tests (terraform test)
        run: |
          stack="stacks/${{ matrix.stack }}"
          if [ -d "$stack/tests" ]; then
            terraform -chdir="$stack" test
          else
            echo "No tests directory in $stack; skipping test suite."
          fi

  plan:
    name: Plan (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      floci:
        image: floci/floci@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
        ports:
          - 4566:4566
    strategy:
      fail-fast: false
      matrix:
        stack: [state-backend, network, security, workload]
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_VAR_organization_id: o-a1b2c3d4e5
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
      STACK: ${{ matrix.stack }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: terraform-version
        run: |
          version="$(tr -d '[:space:]' < .terraform-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Create the emulator state bucket
        shell: bash
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          aws s3 mb s3://floci-plan-state

      - name: Initialize against the emulator (terraform init)
        shell: bash
        run: |
          terraform -chdir="stacks/$STACK" init -input=false -no-color \
            -backend-config="bucket=floci-plan-state" \
            -backend-config="key=$STACK/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_path_style=true" \
            -backend-config="use_lockfile=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true"

      - name: Plan with the qa example variables (terraform plan)
        shell: bash
        run: |
          terraform -chdir="stacks/$STACK" plan -input=false -no-color \
            -var-file=../../environments/qa/qa.tfvars.example \
            -out=tfplan | tee "plan-$STACK.txt"

      - name: Publish the plan summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Terraform plan of $STACK (Floci emulator, qa example variables)"
            if [ -f "plan-$STACK.txt" ]; then
              result="$(grep -E '^(Plan:|No changes\.)' "plan-$STACK.txt" | head -1 || true)"
              echo "Result: ${result:-no plan summary line found}"
              echo '```text'
              tail -n 25 "plan-$STACK.txt"
              echo '```'
            else
              echo "No plan was produced."
            fi
            echo "Emulated plan only: nothing was applied and no cloud resource exists."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the plan artifact for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ matrix.stack }}
          path: plan-${{ matrix.stack }}.txt
          retention-days: 3
          if-no-files-found: ignore
