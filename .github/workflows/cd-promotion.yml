name: CD promotion

# Controlled promotion dev -> qa -> pdn with a mandatory two-step production
# approval (B12, ADR-003, ASM-172, PD-020, PC-IAC-027/028).
#
# PLAN-ONLY: this project stops at the speculative plan (AGENTS.md section 4).
# No job here, or in any workflow, runs a state-changing Terraform command; the
# guard job fails the run if one appears.
#
# Required reviewers on an Environment are not available for a private repository
# on GitHub Free, so the approval is a second run of this workflow:
#   PROMOTION MODE (approve_run_id empty): plan, cost and review. For pdn the run
#     ends after review-pdn, which publishes the plan digest and the exact inputs
#     the approver must use.
#   APPROVAL MODE (approve_run_id set): only the job pdn-approval runs. It checks
#     the approver and the reviewed run with scripts/cd-verify-approval.sh and
#     writes the approval record. An apply job, if ever added, would depend on it.
#
# Self-contained: depends on no B11 workflow. Runbook: docs/cd-pipeline.md.

on:
  push:
    branches: [main]
    paths:
      - "stacks/**"
      - "environments/**"
      - ".terraform-version"
      - "scripts/cd-*"
      - ".github/workflows/cd-*.yml"
  workflow_dispatch:
    inputs:
      promote_to:
        description: Highest environment to promote to (pdn needs a release note or an incident reference)
        type: choice
        options: [qa, pdn]
        default: qa
      base_ref:
        description: Commit for the cost "before" estimate (empty means the parent of the promoted commit)
        type: string
        default: ""
      release_note_url:
        description: HTTPS link to the infrastructure release note with the notice fields (required for pdn)
        type: string
        default: ""
      incident_reference:
        description: Incident reference that overrides the harvest-week window and the release note rule
        type: string
        default: ""
      approve_run_id:
        description: "Approval step: run ID of the earlier pdn review run (leave empty to start a promotion)"
        type: string
        default: ""
      approve_digest:
        description: "Approval step: plan digest shown in the summary of that review run"
        type: string
        default: ""

permissions:
  contents: read

# A newer merge supersedes a promotion run. Safe only because this workflow never
# applies; an apply job, if ever added, needs its own group with cancel-in-progress
# false (design section 4.4). An approval run has its own group per reviewed run
# and is never cancelled, and it never cancels a promotion run.
concurrency:
  group: ${{ inputs.approve_run_id != '' && format('cd-promotion-approval-{0}', inputs.approve_run_id) || format('cd-promotion-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.approve_run_id == '' }}

jobs:
  guard:
    name: Plan-only guard and scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      promote_to: ${{ steps.scope.outputs.promote_to }}
      cost_environments: ${{ steps.scope.outputs.cost_environments }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail if any workflow runs a state-changing Terraform command
        run: |
          pattern='terraform[[:space:]]+(-chdir=[^[:space:]]+[[:space:]]+)?(app[l]y|destr[o]y)|-auto-appro[v]e'
          if grep -rEn "$pattern" .github/workflows scripts; then
            echo "::error::A workflow or script runs a state-changing Terraform command. The project is plan-only."
            exit 1
          fi
          echo "No state-changing Terraform command found in .github/workflows or scripts."

      - name: Resolve the promotion scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_PROMOTE_TO: ${{ inputs.promote_to }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_RELEASE_NOTE: ${{ inputs.release_note_url }}
          INPUT_INCIDENT: ${{ inputs.incident_reference }}
          INPUT_APPROVE_RUN_ID: ${{ inputs.approve_run_id }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          promote_to=qa
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" != refs/heads/main ]; then
              echo "::error::Promotion runs only from main (ref is $REF)."; exit 1
            fi
            promote_to="$INPUT_PROMOTE_TO"
            if [ -n "$INPUT_APPROVE_RUN_ID" ]; then
              {
                echo "mode=approval"
                echo "promote_to=none"
                echo 'cost_environments=["qa"]'
                echo "base_sha=$GITHUB_SHA"
              } >> "$GITHUB_OUTPUT"
              echo "Approval mode: only the production approval job runs for commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if [ "$promote_to" = pdn ] && [ -z "$INPUT_INCIDENT" ]; then
            case "$INPUT_RELEASE_NOTE" in
              https://*) ;;
              *) echo "::error::pdn needs release_note_url (https://) or an incident_reference."; exit 1 ;;
            esac
          fi
          base="$INPUT_BASE_REF"
          if [ -z "$base" ] && [ "$EVENT" = push ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$PUSH_BEFORE"
          fi
          base_sha="$(git rev-parse --verify "${base:-HEAD~1}^{commit}")"
          envs='["qa"]'
          if [ "$promote_to" = pdn ]; then envs='["qa","pdn"]'; fi
          {
            echo "mode=promotion"
            echo "promote_to=$promote_to"
            echo "cost_environments=$envs"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Promoting commit $GITHUB_SHA through dev, qa$([ "$promote_to" = pdn ] && echo ', pdn')." >> "$GITHUB_STEP_SUMMARY"

  plan-dev:
    name: Plan dev
    needs: guard
    if: needs.guard.outputs.mode == 'promotion'
    uses: ./.github/workflows/cd-plan.yml
    with:
      environment: dev

  plan-qa:
    name: Plan qa
    needs: [guard, plan-dev]
    if: needs.guard.outputs.mode == 'promotion'
    uses: ./.github/workflows/cd-plan.yml
    with:
      environment: qa

  plan-pdn:
    name: Plan pdn
    needs: [guard, plan-qa]
    if: needs.guard.outputs.mode == 'promotion' && needs.guard.outputs.promote_to == 'pdn'
    uses: ./.github/workflows/cd-plan.yml
    with:
      environment: pdn

  cost:
    name: Cost estimate (${{ matrix.environment }})
    needs: guard
    if: needs.guard.outputs.mode == 'promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.guard.outputs.cost_environments) }}
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      BASE_SHA: ${{ needs.guard.outputs.base_sha }}
    steps:
      - name: Check out the promoted commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: head
          persist-credentials: false

      - name: Check out the before commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.guard.outputs.base_sha }}
          path: base
          persist-credentials: false

      - name: Check prerequisites
        id: ready
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_TOKEN }}
          INFRACOST_ORG: ${{ vars.INFRACOST_ORG }}
          INFRACOST_METADATA_EGRESS_APPROVED: ${{ vars.INFRACOST_METADATA_EGRESS_APPROVED }}
        run: |
          reason=""
          if [ -z "${INFRACOST_CLI_AUTHENTICATION_TOKEN:-}" ]; then
            reason="The secret INFRACOST_CLI_TOKEN is not available to this run."
          elif [ "${INFRACOST_CLI_AUTHENTICATION_TOKEN#ico-}" != "$INFRACOST_CLI_AUTHENTICATION_TOKEN" ]; then
            reason="The configured token is a legacy ico- key; a CLI v2 token is required (PC-IAC-027)."
          elif [ -z "${INFRACOST_ORG:-}" ] || [ "${INFRACOST_METADATA_EGRESS_APPROVED:-}" != "true" ]; then
            reason="Variables INFRACOST_ORG and INFRACOST_METADATA_EGRESS_APPROVED=true are not both set."
          fi
          if [ -n "$reason" ]; then
            echo "estimate unavailable: $reason"
            python3 head/scripts/cd-cost-summary.py --environment "$ENVIRONMENT" --unavailable "$reason" --out "cost-$ENVIRONMENT.md" > /dev/null
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the checksum-pinned Infracost CLI v2
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/infracost-bin"
          mkdir -p "$bin_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/infracost/cli/releases/download/v2.18.3/infracost-linux-amd64.tar.gz \
            --output "$bin_dir/infracost.tar.gz"
          (cd "$bin_dir" && echo '0950674d6e19eee5c492e59b415f3078c7c6b72421f940543c6cfa884692874e  infracost.tar.gz' | sha256sum --check --strict)
          tar -xzf "$bin_dir/infracost.tar.gz" -C "$bin_dir"
          chmod +x "$bin_dir/infracost"
          "$bin_dir/infracost" --version

      - name: Estimate before and after (no cloud credentials)
        if: steps.ready.outputs.ready == 'true'
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_TOKEN }}
          INFRACOST_ORG: ${{ vars.INFRACOST_ORG }}
          INFRACOST_METADATA_EGRESS_APPROVED: ${{ vars.INFRACOST_METADATA_EGRESS_APPROVED }}
        run: |
          set -uo pipefail
          bin="$RUNNER_TEMP/infracost-bin/infracost"
          work="$RUNNER_TEMP/infracost-work"
          mkdir -p "$work/config" "$work/cache"
          export XDG_CONFIG_HOME="$work/config" XDG_CACHE_HOME="$work/cache" GIT_TERMINAL_PROMPT=0

          # One project per stack, priced with the example variables of this environment.
          scan() {
            local dir="$1" out="$2"
            { echo "version: 0.1"; echo "projects:"; } > "$dir/infracost.yml"
            for stack in "$dir"/stacks/*/; do
              ls "$stack"*.tf >/dev/null 2>&1 || continue
              name="$(basename "$stack")"
              printf '  - name: stacks/%s\n    path: stacks/%s\n    terraform_var_files: [../../environments/%s/%s.tfvars.example]\n' \
                "$name" "$name" "$ENVIRONMENT" "$ENVIRONMENT" >> "$dir/infracost.yml"
            done
            if ! grep -q 'name:' "$dir/infracost.yml"; then
              echo '{"projects":[]}' > "$out"
              return 0
            fi
            (cd "$dir" && "$bin" scan . --org "$INFRACOST_ORG" --currency USD --json --no-color --access-token-use-cache=false) \
              > "$out" 2>/dev/null || rm -f "$out"
          }

          scan base "$work/base.json"
          scan head "$work/head.json"
          python3 head/scripts/cd-cost-summary.py --environment "$ENVIRONMENT" \
            --base-json "$work/base.json" --head-json "$work/head.json" \
            --base-sha "$BASE_SHA" --head-sha "$GITHUB_SHA" --out "cost-$ENVIRONMENT.md" > /dev/null

      - name: Publish the cost estimate to the job summary
        run: cat "cost-$ENVIRONMENT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the cost estimate for the approval review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cost-${{ matrix.environment }}
          path: cost-${{ matrix.environment }}.md
          retention-days: 7

  review-pdn:
    name: Production review (plan and cost)
    needs: [guard, plan-pdn, cost]
    if: needs.guard.outputs.mode == 'promotion' && needs.guard.outputs.promote_to == 'pdn'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_digest: ${{ steps.digest.outputs.plan_digest }}
    env:
      HARVEST_WEEK_DATES: ${{ vars.HARVEST_WEEK_DATES }}
      INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
      RELEASE_NOTE_URL: ${{ inputs.release_note_url }}
    steps:
      - name: Check out the scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download the pdn plan and the pdn cost estimate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{plan,cost}-pdn"
          path: review

      - name: Check the change window
        id: window
        run: bash scripts/cd-window-check.sh

      - name: Record the plan digest
        id: digest
        run: |
          digest="$(sha256sum review/plan-pdn/SHA256SUMS | cut -d' ' -f1)"
          echo "plan_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Write the review the approver reads before approving
        env:
          WINDOW_STATUS: ${{ steps.window.outputs.window_status }}
          PLAN_DIGEST: ${{ steps.digest.outputs.plan_digest }}
          BASE_SHA: ${{ needs.guard.outputs.base_sha }}
          REQUESTER: ${{ github.triggering_actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          read -r destroys replaced < <(awk -F'|' 'NR>2 {d+=$4; r+=$5} END {print d+0, r+0}' review/plan-pdn/summary-pdn.md)
          {
            echo "## Production approval review"
            echo
            echo "This run only reviews the plan. The approval is a second run by another person, as described below. Nothing is applied: the project is plan-only."
            echo
            echo "### How to approve (a person listed in PDN_APPROVERS, other than the requester)"
            echo
            echo "Dispatch **CD promotion** from \`main\` while \`main\` is still at the commit below, and fill only these two inputs. Reject by not approving."
            echo
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| \`approve_run_id\` | \`$RUN_ID\` |"
            echo "| \`approve_digest\` | \`$PLAN_DIGEST\` |"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Requester | $REQUESTER |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Cost before commit | \`$BASE_SHA\` |"
            echo "| Release note | ${RELEASE_NOTE_URL:-none} |"
            echo "| Incident reference | ${INCIDENT_REFERENCE:-none} |"
            echo "| Change window | $WINDOW_STATUS |"
            echo "| Plan digest (SHA-256 of SHA256SUMS) | \`$PLAN_DIGEST\` |"
            echo
            echo "Resources to destroy: **$destroys**. Resources to replace: **$replaced**."
            echo
            echo "### Plan of pdn"
            cat review/plan-pdn/summary-pdn.md
            echo
            cat review/cost-pdn/cost-pdn.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the context the approval run reads
        env:
          REQUESTER: ${{ github.triggering_actor }}
          PLAN_DIGEST: ${{ steps.digest.outputs.plan_digest }}
          PROMOTE_TO: ${{ needs.guard.outputs.promote_to }}
        run: |
          python3 -I -c '
          import json, os
          e = os.environ
          ctx = {"requester": e["REQUESTER"], "commit": e["GITHUB_SHA"], "release_note_url": e["RELEASE_NOTE_URL"],
                 "incident_reference": e["INCIDENT_REFERENCE"], "plan_digest": e["PLAN_DIGEST"], "promote_to": e["PROMOTE_TO"]}
          json.dump(ctx, open("review-context.json", "w"), indent=2)
          '

      - name: Keep the review context for the approval run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-context-pdn
          path: review-context.json
          retention-days: 7

  pdn-approval:
    name: Production approval
    needs: guard
    if: needs.guard.outputs.mode == 'approval'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No Environment: the gate is the check of the approver and of the reviewed
    # run in scripts/cd-verify-approval.sh. Nothing is applied or deployed.
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ACTOR: ${{ github.triggering_actor }}
      PDN_APPROVERS: ${{ vars.PDN_APPROVERS }}
      APPROVE_RUN_ID: ${{ inputs.approve_run_id }}
      APPROVE_DIGEST: ${{ inputs.approve_digest }}
      HARVEST_WEEK_DATES: ${{ vars.HARVEST_WEEK_DATES }}
    steps:
      - name: Check out the scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Verify the approver, the reviewed run and the plan digest
        run: bash scripts/cd-verify-approval.sh

      - name: Keep the approval record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approval-record-pdn
          path: approval-record-pdn.json
          retention-days: 90
